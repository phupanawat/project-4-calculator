<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div class="wrapper">
        <section class="calculator-screen">
            <div class="screen">0</div>
        </section>

        <section class="calculator-buttons">
            <button class="btn double" data-action="clear">C</button>
            <button class="btn" data-action="back">&larr;</button>
            <button class="btn operator" data-operator="/">&divide;</button>

            <button class="btn" data-digit="7">7</button>
            <button class="btn" data-digit="8">8</button>
            <button class="btn" data-digit="9">9</button>
            <button class="btn operator" data-operator="*">&times;</button>

            <button class="btn" data-digit="4">4</button>
            <button class="btn" data-digit="5">5</button>
            <button class="btn" data-digit="6">6</button>
            <button class="btn operator" data-operator="-">&minus;</button>

            <button class="btn" data-digit="1">1</button>
            <button class="btn" data-digit="2">2</button>
            <button class="btn" data-digit="3">3</button>
            <button class="btn operator" data-operator="+">&plus;</button>

            <button class="btn triple" data-digit="0">0</button>
            <button class="btn operator" data-action="equals">&equals;</button>
        </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
